# heckled.dev, proxied to the standalone Next server on 127.0.0.1:3015.
#
# Install as /etc/nginx/sites-available/heckled.dev and link it into
# sites-enabled. On a new host, install only the port 80 block first, reload,
# get the certificate through the acme-challenge location, then the rest:
# nginx will not start if a certificate it names is missing.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.heckled.dev;
    ssl_certificate     /etc/letsencrypt/live/heckled.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heckled.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://heckled.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name heckled.dev;

    ssl_certificate     /etc/letsencrypt/live/heckled.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heckled.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ /\.(?!well-known/) { return 404; }

    # Photo uploads (15 MB) plus the multipart wrapper.
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Next fingerprints these, so nginx serves them straight off disk.
    location /_next/static/ {
        alias /var/www/heckled.dev/.next/static/;
        expires max;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Screenshots and roast audio come from the app (/media/), which reads
    # them from the shared data directory. nginx never needs access to that
    # directory, which also holds the database.

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The waiting page listens over server-sent events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name heckled.dev www.heckled.dev;
    location ~ /\.(?!well-known/) { return 404; }
    # Kept after the redirect, because renewals use this path too.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://heckled.dev$request_uri; }
}
